# Incus profile "dispatch-agent"
#
# Applied on top of "default" to every project base container and every ticket
# container (t-<id>). Install/refresh with:
#
#   incus profile create dispatch-agent            # once
#   incus profile edit   dispatch-agent < infra/agent.profile.yaml
#
# (infra/setup-server.sh does exactly that, idempotently.)
#
# Claude credentials: the host user's LIVE ~/.claude is mounted, not a copy. Claude
# rotates the OAuth refresh token on every refresh, so a copied .credentials.json dies
# as soon as the host (or another copy) refreshes first ("OAuth session expired and
# could not be refreshed"). One shared directory keeps every session on the same token.
#
# About `raw.idmap: both 1000 1000`
# ---------------------------------
# Containers are unprivileged: container uid 0..65535 is mapped to a high host
# uid range (e.g. 1000000..1065535). Without help, host files owned by roman
# (uid 1000) would show up inside the container as "nobody" and the `agent`
# user (container uid 1000) could not read the Claude credentials.
# `raw.idmap` punches one hole in the map: host uid/gid 1000 <-> container
# uid/gid 1000. Writes from the container land on the host as roman again, so
# no chown of /srv/dispatch/secrets is ever needed. It requires the lines
# `root:1000:1` in /etc/subuid and /etc/subgid (setup-server.sh adds them).
# (`shift: "true"` on the disk devices would be the alternative, but the Ubuntu
# incus 6.0 build reports "idmapping abilities are required but aren't supported".)
#
# Nesting / syscall interception
# ------------------------------
# security.nesting lets the container run its own container runtime (Docker
# CE inside the agent image). The two syscall intercepts let Docker's
# overlay/BuildKit create device nodes and set trusted xattrs, which an
# unprivileged container is otherwise not allowed to do.
# infra/build-agent-base.sh sets the same three keys on the throw-away build
# container so the image is produced under identical conditions.
description: Dispatch agent container (Claude Code + gh + docker; shared credential mounts)
config:
  security.nesting: "true"
  security.syscalls.intercept.mknod: "true"
  security.syscalls.intercept.setxattr: "true"
  limits.cpu: "8"
  limits.memory: 16GiB
  raw.idmap: both 1000 1000
  # Docker inside the container: the Incus-generated AppArmor profile makes runc/crun fail
  # with "open sysctl net.ipv4.ip_unprivileged_port_start ...: permission denied" for every
  # container that gets its own network namespace. Running the outer container without that
  # profile fixes it; the container stays unprivileged (user namespace + seccomp). Masking
  # securityfs stops dockerd from trying to load its own AppArmor profile, which it cannot
  # do without the LXC AppArmor namespace and would otherwise refuse to start containers.
  raw.lxc: |
    lxc.apparmor.profile=unconfined
    lxc.mount.entry=tmpfs sys/kernel/security tmpfs defaults 0 0
devices:
  claude-secrets:
    type: disk
    source: /home/roman/.claude
    path: /home/agent/.claude
  gh-secrets:
    type: disk
    source: /srv/dispatch/secrets/gh
    path: /home/agent/.config/gh
